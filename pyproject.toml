[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-analytics"
version = "0.1.0"
description = "Weekly Fantasy Premier League data pipeline: fetch, clean, analyze, visualize."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
