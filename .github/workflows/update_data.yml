name: Update FPL data & deploy dashboard

on:
  schedule:
    # Every day at 03:00 UTC, after FPL's overnight price changes (~01:30 UK
    # time), so each run saves that day's team value and player prices to the
    # daily history tables. GitHub often starts scheduled runs a few hours late.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      entry_id:
        description: "FPL entry ID to pull (defaults to the repo variable FPL_ENTRY_ID, then DEFAULT_ENTRY_ID below)"
        required: false
      league_ids:
        description: "Mini-league IDs for the rival tracker, comma-separated (defaults to the repo variable FPL_LEAGUE_IDS, then DEFAULT_LEAGUE_IDS below)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  # Used when neither a manual input nor the FPL_ENTRY_ID repo variable is set,
  # so the scheduled daily run never starts without an entry ID.
  DEFAULT_ENTRY_ID: "1702239"
  # Rival tracker leagues (the number in the league's URL). 26756 = Trichy
  # Premier League. Set to "auto" to use your smallest private league.
  DEFAULT_LEAGUE_IDS: "26756"

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: pip install -e .

      - name: Run pipeline
        env:
          ENTRY_ID: ${{ inputs.entry_id || vars.FPL_ENTRY_ID || env.DEFAULT_ENTRY_ID }}
          LEAGUE_IDS: ${{ inputs.league_ids || vars.FPL_LEAGUE_IDS || env.DEFAULT_LEAGUE_IDS }}
        run: |
          if [ -z "$ENTRY_ID" ]; then
            echo "::error::No entry ID set. Add a repo variable FPL_ENTRY_ID (Settings -> Secrets and variables -> Actions -> Variables), or pass one when running this workflow manually."
            exit 1
          fi
          python -m fpl_analytics.pipeline "$ENTRY_ID" --leagues "$LEAGUE_IDS"

      - name: Check for changes
        id: diff
        run: |
          git add data/processed data/powerbi dashboard/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit refreshed data
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "fpl-analytics-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: refresh FPL data [skip ci]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy-pages:
    needs: update-data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
